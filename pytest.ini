[pytest]
addopts = -ra --strict-markers -p allure_pytest -p pytest_metadata.plugin -p pytest_html.plugin
minversion = 8.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    api: OctoPrint REST API tests
    ui: Selenium browser tests
    smoke: critical service health checks
    regression: broader business regression suite
    auth: authentication and authorization tests
    connection: printer connection tests
    files: file lifecycle tests
    temperature: temperature monitoring and control tests
    motion: printhead motion and G-code tests
    job: print job state-machine tests
    hardware_control: tests that can command physical hardware
    virtual_printer: tests that require OctoPrint's virtual printer
