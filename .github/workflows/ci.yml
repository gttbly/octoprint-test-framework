name: OctoPrint Automation Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: octoprint-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
  OCTOPRINT_URL: http://127.0.0.1:5000
  OCTOPRINT_API_KEY: ci-e2e-global-api-key
  OCTOPRINT_USERNAME: automation-admin
  OCTOPRINT_PASSWORD: ci-e2e-password
  HEADLESS: "true"
  CI: "true"

jobs:
  quality-and-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install project and OctoPrint
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "OctoPrint==1.11.8"

      - name: Run static quality checks
        run: |
          ruff check .
          ruff format --check .
          python -m compileall -q config pages tests utils

      - name: Configure OctoPrint test instance
        env:
          OCTOPRINT_BASEDIR: ${{ runner.temp }}/octoprint
        run: |
          mkdir -p "$OCTOPRINT_BASEDIR"
          cat > "$OCTOPRINT_BASEDIR/config.yaml" <<'EOF'
          accessControl:
            enabled: true
          api:
            key: ci-e2e-global-api-key
          plugins:
            virtual_printer:
              enabled: true
          serial:
            autoconnect: true
            port: VIRTUAL
            baudrate: 250000
          server:
            firstRun: false
            secretKey: ci-e2e-session-secret
            onlineCheck:
              enabled: false
            pluginBlacklist:
              enabled: false
            seenWizards:
              corewizard: 999
              backup: 999
              tracking: 999
              classicwebcam: 999
          EOF
          octoprint --basedir "$OCTOPRINT_BASEDIR" user add automation-admin \
            --password ci-e2e-password --admin

      - name: Start OctoPrint and wait for readiness
        env:
          OCTOPRINT_BASEDIR: ${{ runner.temp }}/octoprint
        run: |
          nohup octoprint --basedir "$OCTOPRINT_BASEDIR" serve \
            --host 127.0.0.1 --port 5000 > "${{ runner.temp }}/octoprint.log" 2>&1 &
          for attempt in {1..90}; do
            if curl --fail --silent --show-error \
              -H "X-Api-Key: $OCTOPRINT_API_KEY" \
              "$OCTOPRINT_URL/api/version" > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat "${{ runner.temp }}/octoprint.log"
          exit 1

      - name: Run API and Web regression suite
        run: |
          pytest -v \
            --alluredir=allure-results \
            --html=artifacts/pytest-report.html \
            --self-contained-html

      - name: Collect OctoPrint server log
        if: always()
        run: cp "${{ runner.temp }}/octoprint.log" artifacts/octoprint.log || true

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: octoprint-test-evidence-${{ github.run_number }}
          path: |
            allure-results/
            artifacts/
          if-no-files-found: warn
          retention-days: 14
